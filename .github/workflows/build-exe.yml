name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Install Electron Builder
        run: bun add -d electron electron-builder

      - name: Build Web Application
        run: bun run build

      - name: Prepare Static Files
        run: node prepare-static.cjs

      - name: Verify app-public folder
        run: |
          echo "Listing app-public folder:"
          dir app-public
          echo "Listing app-public/assets folder (if exists):"
          dir app-public\assets

      - name: Build Executable
        run: npx electron-builder --windows nsis --config.extraMetadata.main=main.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged resources
        run: |
          echo "Listing dist folder:"
          dir dist
          echo "Listing unpacked resources folder:"
          dir dist\win-unpacked\resources

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Software-Setup-EXE
          path: dist/*.exe
